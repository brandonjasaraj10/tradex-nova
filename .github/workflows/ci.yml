name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # src/lib/supabase.ts throws at import time if these are unset, and
    # three test files import modules that pull it in - so `npm test` and
    # `npm run build` died on import before running anything. .env is
    # gitignored, so CI never had them and every run since this workflow
    # was added on 2026-08-16 failed for this reason alone.
    #
    # Deliberately fake. The suite is pure unit tests over parsing and
    # calculation and never opens a connection; these only need to exist.
    # Using an obviously-invalid URL means anything that DID try to reach
    # Supabase would fail loudly here rather than quietly talk to the real
    # production project from CI.
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-credential

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Informational, not a gate - same treatment as lint below.
      #
      # `npm run typecheck` used to be `tsc --noEmit` against a
      # solution-style tsconfig with "files": [], which checks nothing at all
      # and exits 0. This step passed for that reason alone, never because
      # the code typechecked. Pointing it at tsconfig.app.json on 2026-08-23
      # made it real and surfaced 116 pre-existing errors - mostly unused
      # imports, plus some genuine looseness worth fixing.
      #
      # Failing the build on all 116 the day they became visible would just
      # mean a permanently red CI that everyone learns to ignore, which is
      # how the hollow check survived in the first place. So it runs and
      # reports, and flips to a gate once the backlog is cleared.
      - name: Typecheck (informational - not a merge gate yet)
        run: npm run typecheck
        continue-on-error: true

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint (informational - not a merge gate yet)
        run: npm run lint
        continue-on-error: true
